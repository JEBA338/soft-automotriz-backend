<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios | Soft Automotriz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Gestión de Usuarios</h1>
    <button id="btnLogout">Cerrar sesión</button>
</header>

<main>
    <section>
        <h2>Agregar Usuario</h2>
        <input type="text" id="nombreUsuario" placeholder="Nombre de usuario" required>
        <input type="text" id="nombreCompleto" placeholder="Nombre completo">
        <input type="password" id="contrasenaUsuario" placeholder="Contraseña" required>
        <select id="rolUsuario">
            <option value="admin">Admin</option>
            <option value="tecnico">Técnico</option>
        </select>
        <button id="btnAgregarUsuario">Agregar Usuario</button>
        <p id="mensajeUsuario" style="color:green;"></p>
    </section>

    <section>
        <h2>Lista de Usuarios</h2>
        <table id="tablaUsuarios">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Nombre completo</th>
                    <th>Rol</th>
                    <th>Fecha registro</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>
</main>

<script src="session.js"></script>
<script src="usuarios.js"></script>
</body>
</html>
